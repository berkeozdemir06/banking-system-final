<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÖZAS | RAG Project Compliance & Evidence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --gold: #ffffff;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border: rgba(255, 255, 255, 0.12);
            --border-glow: rgba(255, 255, 255, 0.4);
            --accent: #937d65;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(147, 125, 101, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0; z-index: 100;
        }

        .logo-group { display: flex; align-items: baseline; gap: 12px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: 1px;}
        .subtitle { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); font-weight: 700;}
        
        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            transition: color 0.3s;
            margin-left: 32px;
        }
        .nav-links a:hover { color: var(--gold); }

        .container { max-width: 1200px; margin: 60px auto; padding: 0 40px; }

        .hero { margin-bottom: 60px; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 400; margin-bottom: 16px; }
        .hero p { color: var(--text-dim); max-width: 700px; font-size: 17px; }

        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .check-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            cursor: pointer;
        }

        .check-card:hover {
            border-color: var(--border-glow);
            background: rgba(255,255,255,0.06);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .card-tag {
            font-size: 10px; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; color: var(--accent);
            margin-bottom: 20px;
            padding: 4px 10px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            width: fit-content;
        }

        .card-title { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 12px; }
        .card-desc { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; flex-grow: 1; }
        
        .view-btn {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: #fff;
            display: flex; align-items: center; gap: 8px;
        }
        .view-btn i { font-size: 16px; }

        /* Modal */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s opacity;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal {
            background: #0d0d0d;
            width: 90%; max-width: 900px;
            max-height: 90vh;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            overflow: hidden;
            display: flex; flex-direction: column;
            transform: scale(0.95); transition: 0.3s transform;
        }
        .modal-overlay.active .modal { transform: scale(1); }

        .modal-header {
            padding: 30px 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-body { padding: 40px; overflow-y: auto; }

        .evidence-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .code-container {
            background: #000;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        .code-container pre { font-family: 'Monaco', 'Consolas', monospace; font-size: 13px; color: #ccc; line-height: 1.5; }

        .github-link {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 24px; background: #fff; color: #000;
            text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px;
            transition: opacity 0.2s;
        }
        .github-link:hover { opacity: 0.8; }

        .close-btn { background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <div class="logo">ÖZAS</div>
            <div class="subtitle">Compliance & Evidence</div>
        </div>
        <div class="nav-links">
            <a href="/">Terminal</a>
            <a href="/agent">Analysis</a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Academic Verification</h1>
            <p>Proof of implementation for the Agentic RAG BIST Equity Intelligence System. Explore source code, architecture diagrams, and live system snapshots.</p>
        </div>

        <div class="checklist-grid" id="grid">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal">
            <div class="modal-header">
                <h2 class="logo" id="m-title" style="font-size: 24px;">Module Name</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="m-content">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const data = [
            {
                id: "1",
                tag: "Ingestion System",
                title: "Multi-Source Data Pipelines",
                desc: "Integration of KAP (Public Disclosure Platform), Google News, and PDF research reports via Playwright and Docling.",
                img: "bist_intelligence_dashboard_1776729137096.png",
                file: "backend/agent/ingestion/kap_scraper.py",
                code: `// Intelligent Scraper Logic
const response = await page.goto('https://www.kap.org.tr/en/');
await page.fill('#top_search_input', ticker);
await page.press('#top_search_input', 'Enter');`,
                github: "https://github.com/ozas/bist-intelligence/blob/main/backend/agent/ingestion/kap_scraper.py"
            },
            {
                id: "2",
                tag: "Agentic Logic",
                title: "Autonomous Reasoning Engine",
                desc: "Advanced routing and orchestration using LangChain and Groq to determine search strategies based on user intent.",
                img: "rag_pipeline_architecture_1776729155127.png",
                file: "backend/agent/engine/bist_agent.py",
                code: `class BISTAgent:
    async def step(self, state: AgentState):
        decision = await self.llm.invoke(prompt)
        # Dynamic routing based on 'decision'`,
                github: "https://github.com/ozas/bist-intelligence/blob/main/backend/agent/engine/bist_agent.py"
            },
            {
                id: "3",
                tag: "Evaluation",
                title: "RAGAS Performance Metrics",
                desc: "Live evaluation of faithfulness, answer relevancy, and context precision with automated reporting.",
                img: "bist_intelligence_dashboard_1776729137096.png", 
                file: "backend/agent/evaluation/ragas_eval.py",
                code: `results = evaluate(
    dataset,
    metrics=[faithfulness, answer_relevancy]
)`,
                github: "https://github.com/ozas/bist-intelligence/blob/main/backend/agent/evaluation/ragas_eval.py"
            }
        ];

        const grid = document.getElementById('grid');
        const modalOverlay = document.getElementById('modal-overlay');

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'check-card';
            card.innerHTML = `
                <div class="card-tag">${item.tag}</div>
                <div class="card-title">${item.title}</div>
                <div class="card-desc">${item.desc}</div>
                <div class="view-btn">View Evidence <i>→</i></div>
            `;
            card.onclick = () => openModal(item);
            grid.appendChild(card);
        });

        function openModal(item) {
            const content = document.getElementById('m-content');
            document.getElementById('m-title').textContent = item.title;
            
            content.innerHTML = `
                <img src="/static/${item.img}" class="evidence-img" alt="Evidence">
                <h3 style="margin-bottom:10px; font-size:16px;">Source Code Snippet (${item.file})</h3>
                <div class="code-container">
                    <pre><code>${item.code}</code></pre>
                </div>
                <a href="${item.github}" target="_blank" class="github-link">
                    View full file on GitHub
                </a>
            `;
            
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleOverlayClick(e) {
            if (e.target === modalOverlay) closeModal();
        }
    </script>
</body>
</html>
